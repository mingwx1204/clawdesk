<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0d18"/>
      <stop offset="55%" stop-color="#101322"/>
      <stop offset="100%" stop-color="#0a0c14"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#b9d6ff"/>
      <stop offset="45%" stop-color="#6daaff"/>
      <stop offset="100%" stop-color="#3f7dff"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 深空圆角底 -->
  <rect x="48" y="48" width="928" height="928" rx="216" fill="url(#bg)"/>
  <rect x="52" y="52" width="920" height="920" rx="212" fill="none" stroke="#6daaff" stroke-opacity="0.22" stroke-width="8"/>

  <!-- 原子轨道：与标题栏 SVG 同构（三椭圆 + 中心核） -->
  <g transform="translate(512 512)" fill="none" stroke="#6daaff" stroke-width="52" stroke-linecap="round" filter="url(#glow)">
    <ellipse rx="380" ry="152" opacity="0.92"/>
    <ellipse rx="380" ry="152" opacity="0.92" transform="rotate(60)"/>
    <ellipse rx="380" ry="152" opacity="0.92" transform="rotate(120)"/>
  </g>
  <circle cx="512" cy="512" r="64" fill="url(#core)"/>
  <circle cx="512" cy="512" r="64" fill="none" stroke="#b9d6ff" stroke-opacity="0.55" stroke-width="10"/>
</svg>
